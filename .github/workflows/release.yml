name: release

# 推 tag（v*）自动构建内嵌版 macOS zip 并发 GitHub Release。
# runner 是原生 arm64 macOS，Homebrew 安装 mpv 走正常流程（无本机沙箱问题）。

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 安装 libmpv 与工具
        run: brew install mpv dylibbundler

      - name: 装配 libmpv 本地前缀（版本对齐）
        run: python3 mac-app/setup-mpv-local.py

      - name: 构建内嵌版
        run: APP_VERSION="${GITHUB_REF_NAME#v}" ./mac-app/build.sh

      # 资产名必须 ASCII：GitHub 上传中文资产名会丢失前缀（v1.0.2 实测踩坑）
      - name: 打包 zip
        run: |
          mkdir -p dist
          ditto -c -k --keepParent "mac-app/build/开台直播.app" "dist/kaitai-full-arm64.zip"

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
