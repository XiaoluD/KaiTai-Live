# /etc/nginx/conf.d/iptv.conf
# 静态托管，无后端、无反向代理 —— 服务器只出播放列表文件
#
# 关键点：这里绝对不能出现 proxy_pass 指向 m3u8 源站，
# 一旦加了反代，视频流就变成走服务器带宽（0.8 元/GB）。

server {
    listen 80;
    server_name tv.example.com;          # 换成你的域名或公网 IP

    root /var/www/iptv;
    index index.html;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/vnd.apple.mpegurl;
    gzip_min_length 1024;

    # 页面与脚本：短缓存，改完立刻生效
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 播放列表：不缓存，cron 同步后立即生效
    location /playlists/ {
        add_header Cache-Control "no-store, must-revalidate";
        types { }
        default_type application/octet-stream;
        add_header Content-Disposition inline;
    }

    location = /sources.json {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/iptv.access.log;
}
