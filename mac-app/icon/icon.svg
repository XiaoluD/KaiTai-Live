<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#37269F"/>
      <stop offset="48%" stop-color="#5A34FF"/>
      <stop offset="100%" stop-color="#9B5CFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.16" r="0.78">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#FF2E63"/>
      <stop offset="55%" stop-color="#FF6B3D"/>
      <stop offset="100%" stop-color="#FFC24A"/>
    </linearGradient>
    <linearGradient id="screen" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EFEBFF"/>
    </linearGradient>
    <filter id="screenShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="20" stdDeviation="26" flood-color="#160A46" flood-opacity="0.38"/>
    </filter>
    <filter id="barGlow" x="-60%" y="-40%" width="220%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#FF5A3C" flood-opacity="0.34"/>
    </filter>
    <clipPath id="screenClip">
      <rect x="216" y="286" width="592" height="424" rx="94"/>
    </clipPath>
  </defs>

  <!-- 底板 -->
  <rect x="92" y="92" width="840" height="840" rx="188" fill="url(#bg)"/>
  <rect x="92" y="92" width="840" height="840" rx="188" fill="url(#glow)"/>
  <path d="M280 96 H744 A188 188 0 0 1 932 284 V298 A162 162 0 0 0 770 136 H280 A162 162 0 0 0 118 282 V280 A188 188 0 0 1 280 96 Z"
        fill="#FFFFFF" opacity="0.26"/>

  <!-- 屏幕 -->
  <g filter="url(#screenShadow)">
    <rect x="216" y="286" width="592" height="424" rx="94" fill="url(#screen)"/>
  </g>

  <!-- 波形：7 根圆角竖条，模拟实时信号（不是点播播放键） -->
  <g clip-path="url(#screenClip)" filter="url(#barGlow)">
    <rect x="301" y="448" width="34" height="100" rx="17" fill="url(#bar)"/>
    <rect x="367" y="408" width="34" height="180" rx="17" fill="url(#bar)"/>
    <rect x="433" y="360" width="34" height="276" rx="17" fill="url(#bar)"/>
    <rect x="495" y="330" width="34" height="336" rx="17" fill="url(#bar)"/>
    <rect x="557" y="360" width="34" height="276" rx="17" fill="url(#bar)"/>
    <rect x="623" y="408" width="34" height="180" rx="17" fill="url(#bar)"/>
    <rect x="689" y="448" width="34" height="100" rx="17" fill="url(#bar)"/>
  </g>

  <!-- 屏幕内侧描边 -->
  <rect x="216" y="286" width="592" height="424" rx="94" fill="none"
        stroke="#241073" stroke-opacity="0.09" stroke-width="6"/>

  <!-- 底座：一条，取代原来两条漂浮的胶囊 -->
  <rect x="404" y="742" width="216" height="34" rx="17" fill="#FFFFFF" opacity="0.34"/>
</svg>
