<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>开台 · IPTV</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">开</span>
    <span class="brand-name">开台</span>
  </div>

  <input id="q" class="search" type="search" placeholder="搜索频道…" autocomplete="off">

  <div class="topbar-right">
    <span class="upd-status" id="updStatus"></span>
    <button id="update" class="btn" hidden>更新源</button>
    <button id="checkupd" class="btn" hidden>检查更新</button>
    <button id="settingsBtn" class="iconbtn" title="设置" aria-label="设置">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.08a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.08a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.08a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
</header>

<div class="layout">

  <aside class="rail">
    <div class="rail-title">播放源</div>
    <nav class="sources" id="sources"></nav>
    <div class="rail-foot">
      <select id="group" class="group-select" title="按分组筛选"><option value="">全部分组</option></select>
      <div class="count" id="count">加载中…</div>
    </div>
  </aside>

  <main class="stage">
    <div class="screen" id="screen">
      <video id="video" controls playsinline></video>
      <div class="overlay" id="overlay">
        <div class="ov-title">选一个频道开始</div>
        <div class="ov-sub">视频流由本机直连源站，不经任何中转</div>
      </div>
    </div>

    <div class="nowbar">
      <div class="now-main">
        <div class="now" id="now">未播放</div>
        <div class="url" id="url">—</div>
      </div>

      <div class="controls">
        <button id="pause" class="ctl" disabled>
          <span class="ctl-ico">⏸</span><span class="ctl-label">暂停</span>
        </button>
        <div class="volwrap" id="volwrap" title="音量">
          <span id="volico">🔊</span>
          <input id="vol" type="range" min="0" max="100" value="100">
        </div>
        <button id="retry" class="ctl" title="重试当前频道">
          <span class="ctl-ico">↻</span><span class="ctl-label">重试</span>
        </button>
        <button id="copy" class="ctl" title="复制直链">
          <span class="ctl-ico">⧉</span><span class="ctl-label">复制</span>
        </button>
        <button id="player" class="ctl primary" hidden>用 IINA 打开</button>
        <a id="ext" class="ctl" target="_blank" rel="noopener" title="浏览器打开直链">
          <span class="ctl-ico">↗</span><span class="ctl-label">外链</span>
        </a>
      </div>
    </div>

    <div class="tip" id="tip" hidden></div>

    <div class="grid-head">
      <span class="grid-title">频道</span>
    </div>
    <div class="list" id="list"></div>
  </main>
</div>

<!-- 设置面板（macOS 设置风格） -->
<div class="settings-scrim" id="settingsScrim" hidden>
  <div class="settings" role="dialog" aria-label="设置">
    <div class="settings-head">
      <span class="settings-title">设置</span>
      <button class="iconbtn" id="settingsClose" aria-label="关闭">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="settings-body">
      <div class="settings-section">
        <div class="section-label">外观</div>
        <div class="row">
          <div class="row-label">主题<em>浅色为默认，可选跟随系统</em></div>
          <div class="seg" id="setTheme">
            <button data-v="light">浅色</button>
            <button data-v="dark">深色</button>
            <button data-v="system">跟随系统</button>
          </div>
        </div>
        <div class="row">
          <div class="row-label">频道卡片密度</div>
          <div class="seg" id="setDensity">
            <button data-v="normal">标准</button>
            <button data-v="compact">紧凑</button>
          </div>
        </div>
      </div>

      <div class="settings-section">
        <div class="section-label">通用</div>
        <div class="row">
          <div class="row-label">启动时恢复上次频道</div>
          <button class="switch" id="setResume" role="switch" aria-checked="true"><span></span></button>
        </div>
      </div>

      <div class="settings-section" id="setPlaySection">
        <div class="section-label">播放（内嵌内核）</div>
        <div class="row">
          <div class="row-label">硬件解码<em>VideoToolbox，关掉可规避个别源的解码崩溃</em></div>
          <button class="switch" id="setHwdec" role="switch" aria-checked="true"><span></span></button>
        </div>
      </div>

      <div class="settings-section">
        <div class="section-label">更新</div>
        <div class="row">
          <div class="row-label">启动时自动检查更新</div>
          <button class="switch" id="setAutoCheck" role="switch" aria-checked="true"><span></span></button>
        </div>
        <div class="row">
          <div class="row-label">自动下载并安装更新<em>下载完成后自动换包重启，无需手动确认</em></div>
          <button class="switch" id="setAutoInstall" role="switch" aria-checked="true"><span></span></button>
        </div>
      </div>

      <div class="settings-section">
        <div class="section-label">关于</div>
        <div class="row">
          <div class="row-label">当前版本</div>
          <span class="micro" id="aboutVersion">—</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="./hls.min.js"></script>
<script src="./app.js"></script>
</body>
</html>
